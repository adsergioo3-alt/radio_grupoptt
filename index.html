<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT Radio - Validador de Backend</title>
    <script src="https://radio-grupoptt.onrender.com/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #00ff00;
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 1000px;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        .setup-box {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
            margin: 0 auto;
        }
        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #252525;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        
        #video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid #333;
            aspect-ratio: 4/3;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        /* Efeito visual quando o usuário estiver falando */
        .talking {
            border-color: var(--primary) !important;
            box-shadow: 0 0 15px var(--primary);
        }
        #status-bar {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>PTT Radio Validator</h1>
            <p>Teste de Conexão: <span style="color: var(--primary)">https://radio-grupoptt.onrender.com</span></p>
        </div>

        <div id="setup-area" class="setup-box">
            <input type="text" id="roomInput" placeholder="ID da Sala (ex: sala-teste)">
            <input type="text" id="nameInput" placeholder="Seu Nome">
            <button id="joinBtn">Conectar ao Servidor</button>
        </div>

        <div id="status-bar">Aguardando ação...</div>

        <div id="video-grid">
            </div>
    </div>

    <script>
        // Configurações do Servidor
        const SERVER_URL = 'https://radio-grupoptt.onrender.com';
        const socket = io(SERVER_URL, { secure: true });
        
        const videoGrid = document.getElementById('video-grid');
        const statusMsg = document.getElementById('status-bar');
        const joinBtn = document.getElementById('joinBtn');

        let myPeer;
        let myStream;
        const peers = {};

        // 1. Inicializar PeerJS configurado para o Render (Proxy Seguro)
        function initPeer(peerId) {
            myPeer = new Peer(peerId, {
                host: 'radio-grupoptt.onrender.com',
                path: '/peerjs',
                port: 443,
                secure: true,
                debug: 1 // Reduzido para não poluir muito o console
            });

            myPeer.on('open', id => {
                statusMsg.innerText = `Status: Conectado ao PeerJS (ID: ${id})`;
                console.log('ID PeerJS aberto:', id);
            });

            // Receber chamadas de outros usuários
            myPeer.on('call', call => {
                call.answer(myStream);
                const video = document.createElement('video');
                call.on('stream', userVideoStream => {
                    addVideoStream(video, userVideoStream, call.peer, "Participante");
                });
            });

            myPeer.on('error', err => {
                statusMsg.innerText = `Erro PeerJS: ${err.type}`;
                console.error(err);
            });
        }

        // 2. Lógica para entrar na sala
        joinBtn.addEventListener('click', async () => {
            const room = document.getElementById('roomInput').value;
            const name = document.getElementById('nameInput').value;

            if (!room || !name) return alert("Por favor, preencha a Sala e seu Nome.");

            joinBtn.disabled = true;
            statusMsg.innerText = "Solicitando permissão de mídia...";

            try {
                // Solicita Câmera e Microfone
                myStream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: true
                });

                // Mostra vídeo local
                const myVideo = document.createElement('video');
                addVideoStream(myVideo, myStream, 'me', name, true);

                // Cria ID Único e inicializa PeerJS
                const generatedId = 'user-' + Math.random().toString(36).substr(2, 7);
                initPeer(generatedId);

                // Envia dados para o seu backend via Socket.io
                socket.emit('register', {
                    room: room,
                    peerId: generatedId,
                    name: name
                });

                document.getElementById('setup-area').style.display = 'none';

            } catch (err) {
                console.error("Erro ao acessar mídia:", err);
                alert("Erro: Certifique-se de estar usando HTTPS e permita o acesso à câmera/microfone.");
                joinBtn.disabled = false;
            }
        });

        // 3. Handlers do Socket.io (Seu Backend envia estes eventos)
        socket.on('presence', users => {
            users.forEach(user => {
                // Conectar a novos usuários que não sou eu e não estou conectado ainda
                if (user.peerId !== myPeer.id && !peers[user.peerId]) {
                    connectToNewUser(user.peerId, myStream, user.name);
                }
            });
        });

        socket.on('user_talking', data => {
            const container = document.getElementById('container-' + data.peerId);
            if (container) {
                if (data.isTalking) container.classList.add('talking');
                else container.classList.remove('talking');
            }
        });

        // 4. Funções de Mídia/Vídeo
        function connectToNewUser(peerId, stream, userName) {
            console.log('Chamando usuário:', peerId);
            const call = myPeer.call(peerId, stream);
            const video = document.createElement('video');

            call.on('stream', userVideoStream => {
                addVideoStream(video, userVideoStream, peerId, userName);
            });

            call.on('close', () => {
                const container = document.getElementById('container-' + peerId);
                if (container) container.remove();
            });

            peers[peerId] = call;
        }

        function addVideoStream(video, stream, id, label, isMuted = false) {
            const container = document.createElement('div');
            container.className = 'video-container';
            container.id = 'container-' + id;

            const nameTag = document.createElement('div');
            nameTag.className = 'user-label';
            nameTag.innerText = label;

            video.srcObject = stream;
            if (isMuted) video.muted = true; // Muta o próprio vídeo para evitar eco

            video.addEventListener('loadedmetadata', () => {
                video.play();
            });

            container.append(video);
            container.append(nameTag);
            videoGrid.append(container);
        }
    </script>
</body>
</html>
