<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PTT Radio - Cliente</title>
    <script src="https://radio-grupoptt.onrender.com/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #00ff00;
            --danger: #ff4444;
            --bg: #121212;
            --card: #1e1e1e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .setup-box {
            background: var(--card);
            padding: 25px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }
        input {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #252525;
            color: white;
        }
        #ptt-container {
            display: none;
            text-align: center;
        }
        /* O Botão PTT */
        #ptt-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 8px solid #333;
            background: #222;
            color: #555;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #ptt-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 30px var(--primary);
            transform: scale(0.95);
        }
        #status { margin-top: 20px; color: #888; }
        .user-list { margin-top: 10px; font-size: 0.9em; color: var(--primary); }
    </style>
</head>
<body>

    <div id="setup-area" class="setup-box">
        <h2 style="text-align:center">PTT Radio</h2>
        <input type="text" id="roomInput" placeholder="Sala" value="sala-teste">
        <input type="text" id="nameInput" placeholder="Seu Nome">
        <button onclick="joinRoom()" style="padding:12px; background: #007bff; color:white; border:none; border-radius:6px; font-weight:bold;">ENTRAR</button>
    </div>

    <div id="ptt-container">
        <div id="user-info"></div>
        <button id="ptt-btn">PTT</button>
        <div id="status">Pressione e segure para falar</div>
        <div id="active-users" class="user-list"></div>
    </div>

    <script>
        const SERVER_URL = 'https://radio-grupoptt.onrender.com';
        const socket = io(SERVER_URL);
        let myPeer, myStream, currentRoom, myName;
        const peers = {};

        async function joinRoom() {
            currentRoom = document.getElementById('roomInput').value;
            myName = document.getElementById('nameInput').value;

            if (!currentRoom || !myName) return alert("Preencha tudo!");

            try {
                // Captura apenas ÁUDIO
                myStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                // Começa com microfone desativado (mudo)
                myStream.getAudioTracks()[0].enabled = false;

                initPeer();
                
                document.getElementById('setup-area').style.display = 'none';
                document.getElementById('ptt-container').style.display = 'block';
                document.getElementById('user-info').innerText = `Logado como: ${myName}`;
            } catch (err) {
                alert("Erro ao acessar microfone. Verifique o HTTPS.");
            }
        }

        function initPeer() {
            const peerId = 'ptt-' + Math.random().toString(36).substr(2, 7);
            myPeer = new Peer(peerId, {
                host: 'radio-grupoptt.onrender.com',
                path: '/peerjs',
                port: 443,
                secure: true
            });

            myPeer.on('open', id => {
                socket.emit('register', { room: currentRoom, peerId: id, name: myName });
            });

            // Receber áudio de outros
            myPeer.on('call', call => {
                call.answer(myStream);
                const audio = document.createElement('audio');
                call.on('stream', remoteStream => {
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            });
        }

        socket.on('presence', users => {
            const list = users.filter(u => u.name !== myName).map(u => u.name);
            document.getElementById('active-users').innerText = list.length ? "Online: " + list.join(', ') : "Sozinho na sala";
            
            users.forEach(user => {
                if (user.peerId !== myPeer.id && !peers[user.peerId]) {
                    const call = myPeer.call(user.peerId, myStream);
                    const audio = document.createElement('audio');
                    call.on('stream', remoteStream => {
                        audio.srcObject = remoteStream;
                        audio.play();
                    });
                    peers[user.peerId] = call;
                }
            });
        });

        // Lógica do Botão PTT
        const pttBtn = document.getElementById('ptt-btn');
        
        function startTalking() {
            if (!myStream) return;
            myStream.getAudioTracks()[0].enabled = true;
            pttBtn.classList.add('active');
            socket.emit('talking_state', { peerId: myPeer.id, isTalking: true });
        }

        function stopTalking() {
            if (!myStream) return;
            myStream.getAudioTracks()[0].enabled = false;
            pttBtn.classList.remove('active');
            socket.emit('talking_state', { peerId: myPeer.id, isTalking: false });
        }

        // Eventos Mouse
        pttBtn.addEventListener('mousedown', startTalking);
        pttBtn.addEventListener('mouseup', stopTalking);
        pttBtn.addEventListener('mouseleave', stopTalking);

        // Eventos Touch (Mobile)
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

    </script>
</body>
</html>
